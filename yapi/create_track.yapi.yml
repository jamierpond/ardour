yapi: v1
url: grpc://localhost:50051
service: xdaw.v1.DAWService
rpc: ApplyEdits

body:
  undo_step_name: "Create audio track via yapi"
  operations:
    - create_track:
        name: "YAPI Audio Track"
        type: TRACK_TYPE_AUDIO

expect:
  assert:
    - .success == true
    - (.created_ids | length) >= 1
