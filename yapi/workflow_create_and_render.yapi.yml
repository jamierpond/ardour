yapi: v1
# Full workflow: create track, add clip, render

chain:
  - name: check_capabilities
    url: grpc://localhost:50051
    service: xdaw.v1.DAWService
    rpc: GetCapabilities
    body: {}
    expect:
      assert:
        - .daw_name == "Ardour"
        - .supports_offline_render == true

  - name: create_track
    url: grpc://localhost:50051
    service: xdaw.v1.DAWService
    rpc: ApplyEdits
    body:
      undo_step_name: "Create track for workflow"
      operations:
        - create_track:
            name: "Workflow Track"
            type: TRACK_TYPE_AUDIO
    expect:
      assert:
        - .success == true
        - (.created_ids | length) >= 1

  - name: get_session
    url: grpc://localhost:50051
    service: xdaw.v1.DAWService
    rpc: GetSessionState
    body:
      include_clips: true
    expect:
      assert:
        - .tempo > 0
        - (.tracks | length) >= 1
